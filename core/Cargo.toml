[package]
name = "p2p"
version = "0.1.0"
edition = "2024"

[lib]
name = "p2p"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
libp2p = { version = "0.57.1", default-features = false, features = [
    "tokio",
    "noise",
    "yamux",
    "gossipsub",
    "identify",
    "tcp",
    "websocket",
    "dns",
    "macros",
    "mdns",
] }
vodozemac = "0.11.1"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.34"
env_logger = "0.11.11"
futures = "0.3.34"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
anyhow = "1.0.104"
zeroize = "1.9.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
jni = "0.22.4"
if-watch = "3.2.2"
base64 = "0.23.1"
android_logger = "0.15.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.3", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
    "io-util",
    "fs",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
