name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/react/package-lock.json
            web/solid/package-lock.json
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            .
            web/wasm
      - run: npm ci && npm --prefix web/react ci && npm --prefix web/solid ci
      - run: npm run build:web
      - run: cargo build -p p2p-chat-cli --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: |
          sdkmanager "ndk;29.0.13846066" "platforms;android-37.0"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          bash core/build-android.sh aarch64-linux-android
      - run: ./gradlew assembleDebug lintDebug
        working-directory: mobile/native-android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-debug-arm64
          path: mobile/native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
