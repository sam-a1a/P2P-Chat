version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /web/wasm
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: [/, /web/react, /web/solid]
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: /mobile/native-android
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
