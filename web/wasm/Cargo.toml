[package]
name = "web-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
libp2p = { version = "0.57.1", default-features = false, features = [
    "ed25519",
    "macros",
    "gossipsub",
    "identify",
    "noise",
    "yamux",
    "websocket-websys",
] }
futures = "0.3.34"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["console", "Window", "Document", "HtmlElement", "Response"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.34"
console_log = "1.1.0"
getrandom = { version = "0.4", features = ["wasm_js"] }
